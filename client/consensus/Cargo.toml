[package]
name = "tc-consensus"
authors = [ "Moondance Labs" ]
description = "Client-side worker for Tanssi which unifies Aura and Nimbus"
edition = "2021"
license = "GPL-3.0-only"
version = "0.1.0"

[lints]
workspace = true

[dependencies]
# Substrate deps
# tag = "polkadot-stable2503"
sc-client-api = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
sc-consensus = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
sc-consensus-aura = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
sc-consensus-manual-seal = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
sc-consensus-slots = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
sc-telemetry = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
sc-transaction-pool = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
sc-transaction-pool-api = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
sp-api = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-application-crypto = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false, features = [ "full_crypto", "std" ] }
sp-block-builder = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-blockchain = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
sp-consensus = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-consensus-aura = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-consensus-slots = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-inherents = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-keystore = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-state-machine = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-timestamp = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-transaction-pool = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-version = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
substrate-prometheus-endpoint = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
# Own
dc-orchestrator-chain-interface = { git = "https://github.com/OpenZeppelin/dancekit", branch = "polkadot-stable2503" }
dp-consensus = { git = "https://github.com/OpenZeppelin/dancekit", branch = "polkadot-stable2503", default-features = false, features = [ "std" ] }
pallet-registrar-runtime-api = { path = "../../pallets/registrar/runtime-api", default-features = false, features = [ "std" ] }
pallet-xcm-core-buyer-runtime-api = { path = "../../pallets/xcm-core-buyer/runtime-api", default-features = false, features = [ "std" ] }
tp-traits = { path = "../../primitives/traits", default-features = false }
tp-xcm-core-buyer = { path = "../../primitives/xcm-core-buyer", default-features = false, features = [ "std" ] }

# Cumulus dependencies
cumulus-client-collator = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
cumulus-client-consensus-aura = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
cumulus-client-consensus-common = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
cumulus-client-consensus-proposer = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
cumulus-client-parachain-inherent = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
cumulus-primitives-core = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
cumulus-relay-chain-interface = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }

# Polkadot
polkadot-node-primitives = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
polkadot-node-subsystem = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
polkadot-overseer = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
polkadot-primitives = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
# Nimbus Dependencies
async-backing-primitives = { git = "https://github.com/OpenZeppelin/moonkit", branch = "polkadot-stable2503", default-features = false }
nimbus-consensus = { git = "https://github.com/OpenZeppelin/moonkit", branch = "polkadot-stable2503" }
nimbus-primitives = { git = "https://github.com/OpenZeppelin/moonkit", branch = "polkadot-stable2503", default-features = false, features = [ "std" ] }

# Frontier Dependencies
fc-rpc = { git = "https://github.com/OpenZeppelin/frontier", branch = "polkadot-stable2503", features = ["rpc-binary-search-estimate"] }

# Other deps
async-trait = "0.1"
futures = { version = "0.3.1" }
log = { version = "0.4.22", default-features = false }
parity-scale-codec = { version = "3.0.0", default-features = false, features = [ "derive", "max-encoded-len" ] }
tokio = { version = "1.32.0", default-features = false }
tokio-util = { version = "0.7.10", default-features = false, features = [ "rt" ] }
tracing = { version = "0.1.37", default-features = false }
[dev-dependencies]
cumulus-test-relay-sproof-builder = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
futures-timer = "3.0.1"
orchestra = { version = "0.4.0", default-features = false, features = [ "futures_channel" ] }
parking_lot = "0.12.1"
polkadot-core-primitives = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
polkadot-node-subsystem-test-helpers = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
polkadot-node-subsystem-util = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
polkadot-parachain-primitives = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sc-block-builder = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
sc-keystore = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
sc-network-test = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
sp-keyring = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
sp-tracing = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503", default-features = false }
substrate-test-runtime-client = { git = "https://github.com/paritytech/polkadot-sdk", tag = "polkadot-stable2503" }
tempfile = "3.1.0"

[features]
runtime-benchmarks = [
    "pallet-registrar-runtime-api/runtime-benchmarks"
]